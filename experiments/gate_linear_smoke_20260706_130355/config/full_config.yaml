backbone:
  library: open_clip
  name: hf-hub:imageomics/bioclip-2
  image_size: 224
classifier:
  type: linear
  dropout: 0.1
lora:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.1
  bias: none
training:
  epochs: 1
  batch_size: 8
  gradient_accumulation_steps: 4
  num_workers: 2
  seed: 42
  deterministic: true
optimizer:
  type: adamw
  learning_rate: 0.0002
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
scheduler:
  type: cosine_with_warmup
  warmup_steps: 200
  min_lr_ratio: 0.01
precision:
  mixed_precision: true
  dtype: fp16
  gradient_clip_max_norm: 1.0
loss:
  type: cross_entropy
  label_smoothing: 0.1
  use_class_weights: true
early_stopping:
  enabled: true
  patience: 7
  monitor: val_accuracy
  min_delta: 0.001
  mode: max
checkpointing:
  save_best_accuracy: true
  save_best_f1: true
  save_last: true
  descriptive_names: true
preprocessing:
  resize_size: 256
  crop_size: 224
  interpolation: bicubic
  normalize:
    mean:
    - 0.48145466
    - 0.4578275
    - 0.40821073
    std:
    - 0.26862954
    - 0.26130258
    - 0.27577711
train_augmentation:
  horizontal_flip:
    enabled: true
    p: 0.5
  rotation:
    enabled: true
    degrees: 15
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.15
    hue: 0.05
  gaussian_blur:
    enabled: true
    kernel_size: 3
    sigma:
    - 0.5
    - 1.0
    p: 0.3
  random_erasing:
    enabled: true
    p: 0.2
    scale:
    - 0.02
    - 0.1
    ratio:
    - 0.3
    - 3.3
  vertical_flip:
    enabled: false
    reason: Fish do not swim upside down
  perspective:
    enabled: false
    reason: Distorts body proportions used for species identification
val_augmentation: null
dataset:
  crops_dir: OzFish/crops-zip/assets/projects/FDFML/crops
  metadata_csv: OzFish/crop_metadata.csv
  processed_dir: datasets/processed
  metadata_dir: datasets/metadata
  reports_dir: datasets/reports
  statistics_dir: datasets/statistics
  cache_dir: datasets/cache
  class_mapping_source: catalog
  master_catalog: datasets/metadata/master_species_catalog.json
split:
  ratios:
  - 0.7
  - 0.15
  - 0.15
  random_seed: 42
  min_images_per_species: 100
  require_all_splits: true
validation:
  min_bbox_width_px: 20
  min_bbox_height_px: 20
  min_bbox_area_px2: 400
  check_readability: false
  readability_sample_frac: 0.05
analysis:
  absolute_minimum_images: 20
  viability_threshold: 100
  recommended_threshold: 200
  high_quality_threshold: 500
  exclude_spp_labels: true
  exclude_empty_labels: true
logging:
  level: INFO
  format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
  date_format: '%H:%M:%S'
  console: true
  file: true
  filename: training.log
experiment:
  base_dir: experiments
  auto_name: true
  base_name: bioclip2_lora
tensorboard:
  enabled: true
  log_train_loss_every_n_steps: 10
  log_val_metrics: true
  log_learning_rate: true
  log_gpu_stats: true
csv_logging:
  enabled: true
  filename: training_history.csv
gpu_monitoring:
  enabled: true
  filename: gpu_stats.csv
  log_interval_steps: 50
system_info:
  platform: Windows-10-10.0.26300-SP0
  python: 3.11.15
  torch: !!python/object/new:torch.torch_version.TorchVersion
  - 2.11.0+cu128
  cuda_available: 'True'
  cuda_version: '12.8'
  gpu_name: NVIDIA GeForce RTX 3050 6GB Laptop GPU
  gpu_memory_gb: '6.4'
