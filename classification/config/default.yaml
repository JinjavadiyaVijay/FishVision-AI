dataset:
  # Paths relative to project root (c:\fish_detection)
  crops_dir: "OzFish/crops-zip/assets/projects/FDFML/crops"
  metadata_csv: "OzFish/crop_metadata.csv"

output:
  datasets_dir: "datasets"

validation:
  min_bbox_width_px: 20
  min_bbox_height_px: 20
  min_bbox_area_px2: 400
  # Set true to PIL-open every image (slow — ~5 min for 80K files)
  check_readability: false
  readability_sample_frac: 0.05   # fraction to sample when check_readability=true

analysis:
  # Thresholds for the recommendation engine (data-driven — not hard-coded species counts)
  absolute_minimum_images: 20      # exclude below this regardless
  viability_threshold: 100         # "viable" for proper train/val/test split
  recommended_threshold: 200       # "comfortable" — recommended minimum
  high_quality_threshold: 500      # "high quality" — well-resourced

  # Stereo pair handling
  exclude_spp_labels: true         # exclude 'spp', 'sp', 'sp1'...'sp99' labels
  exclude_empty_labels: true

  # Split ratios [train, val, test]
  split_ratios: [0.70, 0.15, 0.15]
  random_seed: 42

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
