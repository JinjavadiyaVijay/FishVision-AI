# ──────────────────────────────────────────────────────────────────────────────
# dataset.yaml — Dataset paths and split configuration
# ──────────────────────────────────────────────────────────────────────────────

dataset:
  # Source dataset (for Phase 2 data engineering)
  crops_dir: "OzFish/crops-zip/assets/projects/FDFML/crops"
  metadata_csv: "OzFish/crop_metadata.csv"

  # Processed dataset (output of Phase 2 splitting)
  processed_dir: "datasets/processed"
  metadata_dir: "datasets/metadata"
  reports_dir: "datasets/reports"
  statistics_dir: "datasets/statistics"
  cache_dir: "datasets/cache"

  # Class mapping source: use master catalog for global consistency
  class_mapping_source: "catalog"
  master_catalog: "datasets/metadata/master_species_catalog.json"

split:
  ratios: [0.70, 0.15, 0.15]
  random_seed: 42

  # Species filtering
  min_images_per_species: 100
  require_all_splits: true    # Exclude species missing from any split

validation:
  min_bbox_width_px: 20
  min_bbox_height_px: 20
  min_bbox_area_px2: 400
  check_readability: false
  readability_sample_frac: 0.05

analysis:
  absolute_minimum_images: 20
  viability_threshold: 100
  recommended_threshold: 200
  high_quality_threshold: 500
  exclude_spp_labels: true
  exclude_empty_labels: true
